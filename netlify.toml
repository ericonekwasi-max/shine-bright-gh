# Netlify deployment config for this TanStack Start app.
# The build is server-rendered, so Netlify must run the server, not just serve files.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Build the server for Netlify Functions. Without this the build keeps
  # Lovable's Cloudflare default; Netlify is auto-detected anyway, this makes it explicit.
  NITRO_PRESET = "netlify"
